# Сайт и API на одном домене: https://sorangptgraph.xyz
#
# Рабочий конфиг nginx. На сервере лежит в
# /etc/nginx/sites-available/sorangptgraph.xyz (включён ссылкой из
# sites-enabled). Как применить и откатить — deploy/DEPLOY.md.
#
#   /api/…        → сервер приложения под pm2 (порт 3001);
#   всё остальное → сайт: сборка клиента в /var/www/sorangptgraph, её кладёт
#                   deploy/deploy-site.sh.
#
# Блок location /api/, строки сертификата и таймауты перенесены из прежнего
# конфига без изменений.

# С каких чужих адресов браузеру можно обращаться к API: сборка на GitHub
# Pages и локальная разработка. Сайту на этом же домене строка не нужна —
# запросы к своему домену браузер не проверяет.
map $http_origin $cors_origin {
    default "";
    "http://localhost:4000" "http://localhost:4000";
    "https://pepormaty.github.io" "https://pepormaty.github.io";
    "http://127.0.0.1:3000" "http://127.0.0.1:3000";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# http → https, сразу на адрес без www.
server {
    listen 80;
    server_name sorangptgraph.xyz www.sorangptgraph.xyz;
    return 301 https://sorangptgraph.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name sorangptgraph.xyz www.sorangptgraph.xyz;

    ssl_certificate /etc/letsencrypt/live/sorangptgraph.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorangptgraph.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_header_timeout 3600s;
    client_body_timeout   3600s;
    client_max_body_size  20m;
    keepalive_timeout     75s;
    send_timeout          3600s;

    # www → без www: у сайта один адрес, поисковикам так проще.
    if ($host = www.sorangptgraph.xyz) {
        return 301 https://sorangptgraph.xyz$request_uri;
    }

    # Сборка клиента, её кладёт deploy/deploy-site.sh.
    root /var/www/sorangptgraph;
    index index.html;
    # Кодировка и для .txt/.xml: в security.txt комментарий по-русски.
    charset utf-8;

    # Заголовки безопасности (файл из deploy/nginx/ кладётся в
    # /etc/nginx/snippets/). Блоки ниже со своим add_header подключают его
    # заново: add_header внутри location отменяет заголовки уровнем выше.
    # В /api/ их нет — там свои заголовки CORS, как и раньше.
    include snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location /api/ {

    # ===========================
    # PRE-FLIGHT (OPTIONS)
    # ===========================
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }

    # ===========================
    # NORMAL CORS HEADERS
    # ===========================
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    # ===========================
    # PROXY → EXPRESS
    # ===========================
    proxy_pass http://127.0.0.1:3001;

    proxy_http_version 1.1;

    # если ВЕБСОКЕТЫ не используешь — эти 2 строки можно вообще убрать
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🔥 КРИТИЧНО ДЛЯ ДОЛГИХ GPT-ОТВЕТОВ
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    send_timeout          3600s;
    gzip off;


    # чтобы не было приколов с буферизацией на долгих ответах
    proxy_buffering off;
    proxy_request_buffering off;

    access_log /var/log/nginx/api_timed.log api_timed;

    }

    # Файлы сборки: в имени хэш содержимого, поэтому кэшировать можно на год.
    location /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Сама страница приложения — без кэша: обновление сайта видно сразу.
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Всё остальное: файл, если он есть (robots.txt, terms.html — и /terms без
    # .html), иначе приложение — его внутренние адреса (/guide, /g/…) знает
    # оно само.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
