# Заголовки безопасности сайта sorangptgraph.xyz.
#
# Кладётся в /etc/nginx/snippets/ и подключается строкой
#   include snippets/security-headers.conf;
# в КАЖДЫЙ блок, где есть свой add_header: в nginx add_header внутри location
# отменяет все заголовки, заданные уровнем выше, — без повтора они молча
# пропадут.
#
# Их проверяют сканеры вроде securityheaders.com и Mozilla Observatory.

# Только HTTPS на год вперёд. Без includeSubDomains: поддомены пока не на HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
# Браузер не угадывает тип файла сам.
add_header X-Content-Type-Options "nosniff" always;
# Сайт нельзя встроить в чужую страницу (защита от кликджекинга).
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Откуда странице можно грузить код, стили и данные:
#   — скрипты и запросы — только со своего домена (API тоже здесь, /api);
#   — стили и шрифты — ещё с Google Fonts (шрифт Inter);
#   — встроенных скриптов нет (переходы со старых ссылок GitHub Pages —
#     отдельный файл spa-redirect.js), поэтому 'unsafe-inline' только для
#     стилей: их React Flow пишет прямо в узлы.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
