<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>gpt-graf</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Перенаправляет deep-link (например /gpt-graph-client/g/<id>) на index.html,
      // сохраняя путь в query, который восстанавливается скриптом в index.html.
      // pathSegmentsToKeep = 1 — сохраняем сегмент базового пути "/gpt-graph-client".
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
